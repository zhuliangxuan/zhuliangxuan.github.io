<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面未找到 · 百宝箱</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta http-equiv="refresh" content="5;url=/">
<style>
:root{--brand:#863bff;--grad:linear-gradient(135deg,#5b7cfa 0%,#863bff 55%,#b44bff 100%)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f6f5fb;color:#1c1b29;text-align:center;margin:0;
}
@media (prefers-color-scheme: dark){
  body{background:#0e0d16;color:#eceaf6}
}
.box{padding:40px 24px}
.code{
  font-size:96px;font-weight:900;line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:22px;margin:18px 0 10px}
p{color:#5f5d72;font-size:15px;margin:0 0 28px}
a.btn{
  display:inline-block;background:var(--grad);color:#fff;text-decoration:none;
  padding:12px 34px;border-radius:999px;font-weight:700;font-size:15px;
  box-shadow:0 8px 20px -8px rgba(134,59,255,.55);transition:transform .2s;
}
a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>工具箱里找不到这个页面</h1>
  <p>页面可能已迁移，<span id="s">5</span> 秒后自动回到首页…</p>
  <a class="btn" href="/">回到百宝箱首页</a>
</div>
<script>var t=5;setInterval(function(){t=Math.max(0,t-1);document.getElementById('s').textContent=t},1000)</script>
</body>
</html>
